<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ff9933" />
  <title>Camptocamp — choix de la version</title>
  <style>
    /* Tiny inline CSS — this page is meant to redirect under 100 ms, the
       UI below is only seen if JS is disabled or the user picks the
       "Let me choose" path. */
    :root { color-scheme: light; }
    html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #fbfaf6; color: #4a4a4a; }
    body { display: flex; align-items: center; justify-content: center; padding: 1rem; box-sizing: border-box; }
    .card { max-width: 380px; width: 100%; background: white; border: 1px solid rgba(0,0,0,.12); border-radius: 10px; padding: 1.5rem 1.25rem; box-shadow: 0 6px 20px rgba(0,0,0,.06); }
    h1 { margin: 0 0 .3rem; font-size: 1.05rem; color: #4a4a4a; }
    p { margin: 0 0 1rem; font-size: .85rem; color: #6b6b6b; line-height: 1.45; }
    .row { display: grid; gap: .5rem; }
    a.btn { display: block; padding: .7rem .8rem; background: white; border: 1px solid rgba(0,0,0,.15); border-radius: 8px; color: #4a4a4a; text-decoration: none; font-size: .9rem; font-weight: 600; text-align: center; }
    a.btn.primary { background: #ff9933; border-color: #ff9933; color: white; }
    a.btn:hover { box-shadow: 0 2px 6px rgba(0,0,0,.08); }
    .note { margin-top: .9rem; font-size: .72rem; color: #9a9a9a; text-align: center; }
  </style>
  <script>
    // Smart redirect: communicate ONE link, the right surface opens on
    // each device. Runs synchronously so the UI below only flashes if
    // the redirect is bypassed (no JS / explicit ?choose=1).
    (function () {
      var MOBILE_URL = '/c2c-mobile-v3/';
      var DESKTOP_URL = 'https://www.camptocamp.org/';
      var qs = new URLSearchParams(location.search);
      // Manual overrides (handy when sharing the link with someone on the
      // "wrong" device or when testing the desktop redirect from a phone).
      var force = qs.get('force');
      if (force === 'mobile') return location.replace(MOBILE_URL);
      if (force === 'desktop') return location.replace(DESKTOP_URL);
      // Explicit choice screen — link out as `?choose=1` if you don't want
      // automatic redirection.
      if (qs.get('choose') === '1') return;
      // UA detection: iOS / Android / mobile-class browsers → mobile PWA.
      // Desktop or unknown → c2c.org (the established surface).
      var ua = navigator.userAgent || '';
      var isMobile = /Mobi|Android|iPhone|iPad|iPod|Opera Mini|IEMobile|webOS/i.test(ua);
      location.replace(isMobile ? MOBILE_URL : DESKTOP_URL);
    })();
  </script>
</head>
<body>
  <noscript>
    <div class="card">
      <h1>Choisir une version</h1>
      <p>JavaScript est désactivé. Choisissez la version à ouvrir&nbsp;:</p>
      <div class="row">
        <a class="btn primary" href="/c2c-mobile-v3/">Version mobile</a>
        <a class="btn" href="https://www.camptocamp.org/">Version ordinateur (camptocamp.org)</a>
      </div>
    </div>
  </noscript>
  <div class="card" id="choice" hidden>
    <h1>Camptocamp</h1>
    <p>Sur quelle version souhaitez-vous continuer&nbsp;?</p>
    <div class="row">
      <a class="btn primary" href="/c2c-mobile-v3/">📱 Version mobile (PWA)</a>
      <a class="btn" href="https://www.camptocamp.org/">💻 Version ordinateur (camptocamp.org)</a>
    </div>
    <p class="note">Ajoutez ?force=mobile ou ?force=desktop à l'URL pour forcer un choix.</p>
  </div>
  <script>
    // If the auto-redirect was bypassed (?choose=1), show the picker.
    if (new URLSearchParams(location.search).get('choose') === '1') {
      document.getElementById('choice').hidden = false;
    }
  </script>
</body>
</html>
